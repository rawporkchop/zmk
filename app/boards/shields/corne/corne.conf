# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y
#
# # Enable nice!view
CONFIG_ZMK_DISPLAY=y

# Enable battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y

# Sleep settings - keyboard goes to sleep after 15 minutes
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Increase BLE transmit power for better connectivity
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable deep sleep support
CONFIG_ZMK_PM_SOFT_OFF=y

# Debounce settings for better key press detection
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Display settings
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Split/BLE improvements
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Display work queue (helps with initialization timing)
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# I2C settings (try if above doesn't work)
CONFIG_I2C_INIT_PRIORITY=50

# Memory settings (if you see crashes or blanking)
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Enable Turn off keyboard
CONFIG_ZMK_PM_SOFT_OFF=y
